<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var t = localStorage.getItem("app_theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "ToM");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "ToM");
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Gestionnaire d'evenements et de tables de jeu" />
    <meta name="theme-color" content="#232323" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TomManager" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>TomManager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
